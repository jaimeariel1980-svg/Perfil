<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz día mami</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#f0c0e6;overflow:hidden;font-family:'Playfair Display',Georgia,serif;cursor:none}
.s{position:fixed;inset:0;opacity:0;transition:opacity 1s;display:flex;align-items:center;justify-content:center;overflow:hidden}
.s.on{opacity:1}
.s img{position:relative;height:100vh;max-width:100vw;object-fit:contain;transform:scale(1);transition:transform 6s linear}
.s.on img{transform:scale(1.04)}
#qr{flex-direction:column;gap:3vh;text-align:center;color:#000;background:#f0c0e6}
#qr h1{background:#fff;padding:1.5vh 3vw;font-size:6vh;font-weight:900;line-height:1.15;transform:rotate(-1.5deg)}
#qr .box{background:#fff;padding:2.5vh;border-radius:2vh;box-shadow:0 1vh 4vh #0003;animation:p 2s ease-in-out infinite}
#qr svg{display:block;height:46vh;width:46vh}
#qr p{font-size:3.2vh;font-weight:600}
@keyframes p{50%{transform:scale(1.04)}}
#bar{position:fixed;left:0;bottom:0;height:.8vh;background:#000;width:0;z-index:9}
#hint{position:fixed;top:2vh;right:2vw;font:2vh sans-serif;color:#0008;z-index:9;transition:opacity 1s}
</style></head><body>
<div id="bar"></div><div id="hint">Click o ▶ para iniciar · F pantalla completa · ← → navegar</div>
<div id="qr" class="s"><h1>Escaneá el QR<br>para empezar a buscar tu regalo 🎁</h1><div class="box" id="code"></div><p>Apuntá la cámara del celular</p></div>
<script src="qrcode.js"></script>
<script>
const D=5000,N=5,$=s=>document.querySelector(s);
const qrEl=$('#qr');
for(let i=N;i>=1;i--){const d=document.createElement('div');d.className='s';d.innerHTML=`<img src="img/${i}.jpg">`;document.body.prepend(d)}
const slides=[...document.querySelectorAll('.s')];
const url=new URL('pista.html?c=a1x',location.href).href;
const q=qrcode(0,'M');q.addData(url);q.make();$('#code').innerHTML=q.createSvgTag({cellSize:8,margin:0,scalable:true});
let i=-1,t,started=false;
function go(n){i=(n+slides.length)%slides.length;slides.forEach((s,k)=>s.classList.toggle('on',k===i));clearTimeout(t);
 const b=$('#bar');b.style.transition='none';b.style.width='0';
 if(i<slides.length-1){requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${D}ms linear`;b.style.width='100%'}));t=setTimeout(()=>go(i+1),D)}}
function start(){if(started)return;started=true;$('#hint').style.opacity=0;go(0)}
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.();else if(!started)start();else if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter')go(i+1);else if(e.key==='ArrowLeft')go(i-1);else if(e.key==='r'||e.key==='R')go(0)});
addEventListener('click',()=>{if(!started){document.documentElement.requestFullscreen?.().catch(()=>{});start()}else go(i+1)});
document.documentElement.onmousemove=()=>{document.body.style.cursor='default';clearTimeout(window._m);window._m=setTimeout(()=>document.body.style.cursor='none',2000)};
</script></body></html>
