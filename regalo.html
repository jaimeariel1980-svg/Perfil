<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu regalo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:#f0c0e6;font-family:'Playfair Display',Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:5vw;text-align:center;overflow-x:hidden}
h1,h2{background:#fff;padding:.4em .7em;line-height:1.15;font-weight:900;transform:rotate(-2deg)}
h1{font-size:9vw}h2{font-size:6.5vw;transform:rotate(1.5deg)}
.card{width:min(90vw,70vh*1.5);border-radius:3vw;box-shadow:0 2vw 6vw #0004;opacity:0;transform:scale(.7) rotate(-6deg);transition:1s cubic-bezier(.2,1.4,.4,1)}
.card.on{opacity:1;transform:none}
canvas{position:fixed;inset:0;pointer-events:none}
@media(min-width:700px){h1{font-size:4vw}h2{font-size:3vw}.card{width:40vw}}
</style></head><body>
<canvas id="c"></canvas>
<h1>¡Lo encontraste!</h1>
<img class="card" src="img/5.jpg" alt="Vale por unas zapatillas">
<h2>Tu regalo está acá, alrededor del hogar 🔥</h2>
<script>
setTimeout(()=>document.querySelector('.card').classList.add('on'),300);
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
const r=()=>{W=c.width=innerWidth;H=c.height=innerHeight};r();addEventListener('resize',r);
const cols=['#000','#fff','#ff5fb7','#ffd1f0','#b14aed'];
const p=Array.from({length:120},()=>({x:Math.random()*W,y:-Math.random()*H,s:6+Math.random()*8,v:2+Math.random()*3,a:Math.random()*6,c:cols[Math.random()*5|0]}));
(function f(){x.clearRect(0,0,W,H);for(const o of p){o.y+=o.v;o.a+=.05;o.x+=Math.sin(o.a);if(o.y>H){o.y=-10;o.x=Math.random()*W}x.fillStyle=o.c;x.fillRect(o.x,o.y,o.s,o.s*.6)}requestAnimationFrame(f)})();
</script></body></html>
