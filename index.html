<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz día mami</title>
<style>
*{margin:0}html,body{height:100%;background:#f2c3e7;overflow:hidden;cursor:none}
img{position:fixed;inset:0;margin:auto;height:100vh;max-width:100vw;object-fit:contain;opacity:0;transition:opacity 1s}
img.on{opacity:1}
</style></head><body>
<script>
const N=4,D=5000,im=[...Array(N)].map((_,i)=>{const e=new Image();e.src=`tv/${i+1}.jpg`;document.body.append(e);return e});
let i=-1,t;const go=n=>{i=Math.max(0,Math.min(N-1,n));im.forEach((e,k)=>e.classList.toggle('on',k===i));clearTimeout(t);if(i<N-1)t=setTimeout(()=>go(i+1),D)};
addEventListener('click',()=>{document.documentElement.requestFullscreen?.().catch(()=>{});go(i+1)});go(0);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);else if(e.key==='r')go(0);else if(e.key!=='f')go(i+1);else document.documentElement.requestFullscreen?.()});
</script></body></html>
