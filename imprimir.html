<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR para imprimir</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:#fff;padding:16px}
.n{max-width:700px;margin:0 auto 16px;font:16px sans-serif;line-height:1.4}.n button{font:inherit;padding:.5em 1em;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm;max-width:190mm;margin:auto}
.c{background:#f0c0e6;border:1px dashed #000;padding:6mm;text-align:center;break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:3mm}
.c h2{background:#fff;padding:1mm 4mm;font-size:6mm;transform:rotate(-1.5deg)}
.q{background:#fff;padding:3mm}.q svg{display:block;width:55mm;height:55mm}
.c p{font-size:3.5mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.n{display:none}body{padding:0}}
</style></head><body>
<div class="n"><b>QR de la búsqueda.</b> Abrí esta hoja desde la dirección publicada (no desde un archivo), imprimí, recortá por las líneas y pegá cada QR donde dice abajo.<br><button onclick="print()">Imprimir</button></div>
<div class="g" id="g"></div>
<script src="qrcode.js"></script><script src="pistas.js"></script>
<script>
const base=new URL('.',location.href).href;
const items=[...PISTAS.slice(1).map((p,k)=>({u:`${base}pista.html?c=${p.c}`,w:PISTAS[k].lugar,n:k+2})),{u:`${base}regalo.html`,w:PISTAS[5].lugar,n:'Final'}];
g.innerHTML=items.map(o=>{const q=qrcode(0,'M');q.addData(o.u);q.make();return `<div class="c"><h2>${o.n==='Final'?'¡Último QR!':'Escaneame 👀'}</h2><div class="q">${q.createSvgTag({cellSize:8,margin:0,scalable:true})}</div><p>Va pegado en: ${o.w}</p></div>`}).join('');
</script></body></html>
