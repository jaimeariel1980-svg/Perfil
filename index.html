<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz día mami</title>
<style>
*{margin:0}html,body{height:100%;background:#f2c3e7;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
img{position:fixed;inset:0;margin:auto;height:100vh;max-width:100vw;object-fit:contain;opacity:0;transition:opacity 1s}
img.on{opacity:1}
b{position:fixed;top:0;bottom:0;width:30vw;display:flex;align-items:center;font:12vh sans-serif;color:#0000;cursor:pointer;z-index:2}
b{color:#0000}#p{left:0;padding-left:2vw}#n{right:0;justify-content:flex-end;padding-right:2vw;width:70vw}
button{position:fixed;bottom:3vh;width:64px;height:64px;border-radius:50%;border:0;background:#fffa;color:#000;font:40px/1 sans-serif;z-index:3;transition:opacity .5s}
#bp{left:3vw}#bn{right:3vw}body.h button{opacity:0}
</style></head><body>
<b id="p"></b><b id="n"></b><button id="bp">‹</button><button id="bn">›</button>
<script>
const N=4,D=5000,im=[...Array(N)].map((_,i)=>{const e=new Image();e.src=`tv/${i+1}.jpg`;document.body.append(e);return e});
let i=0,t;
const go=(n,auto)=>{i=Math.max(0,Math.min(N-1,n));im.forEach((e,k)=>e.classList.toggle('on',k===i));clearTimeout(t);if(auto&&i<N-1)t=setTimeout(()=>go(i+1,1),D)};
const fs=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
p.onclick=bp.onclick=()=>go(i-1);n.onclick=bn.onclick=()=>{fs();go(i+1)};
let h;const show=()=>{document.body.classList.remove('h');clearTimeout(h);h=setTimeout(()=>document.body.classList.add('h'),3000)};['touchstart','mousemove','click'].forEach(v=>addEventListener(v,show));show();
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='Backspace')go(i-1);else if(e.key==='f')fs();else if(e.key==='r')go(0,1);else go(i+1)});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(d>50)go(i-1);else if(d<-50)go(i+1)});
go(0,1);
</script></body></html>
